<!--We change the block and inline element by using CSS-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block Elements - HTML</title>
    <link rel="stylesheet" href="for_05_html.css
    ">
</head>

<body>
    <p>Hey I am para</p><!--Block Element-->
    <a href="https://google.com">open google</a><!--inline element-->
    <div>I am a block element</div> <!--block element-->
    <span>I am span and I am inline</span><!--inline element-->
    <a href="">yes it is inline</a><!--inline element-->
</body>

</html>
