<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS color</title>
    <style>
        h1{
            /* color: orange; */
            /* color: #fab; Using Hex cloring */
            /* color: rgb(43, 255, 0); */
            /* color: rgba(90,26, 45, 4); */
            color: hsl(34, 47%, 49%);
            background-color: rgb(117, 226, 226);
        }
    </style>
</head>
<body>
    <h1>Lets learn about colors</h1>
    <p>
        Color can be represented in :
        <ol>
            <li>Color</li>
            <li>Hex Color Code</li>
            <li>rgb</li>
            <li>RGBA</li>
            <li>HSL</li>
        </ol>
    </p>
</body>
</html>
