<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Overflow</title>
    <style>
        .box{
            width: 30vw;
            height: 10vh;
            border: 2px solid black;
            /* overflow: auto; */
            /* overflow-x: hidden; */
            /* overflow-y: scroll;  */
             overflow: hidden auto ;
            text-overflow: ellipsis;
            background-color: aqua;
            
        }
    </style>
</head>
<body>

        Lorem ipsum dolor, sit amet consectetur adipisicing elit. Excepturi inventore sapiente nulla nesciunt voluptatum! Reiciendis fugiat soluta eligendi saepe labore, ratione eum similique nisi enim, quis, consequuntur nulla facilis officiis.
    </div>
</body>
</html>
