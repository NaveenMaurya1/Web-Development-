<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters </title>
    <style>
        .img1{
            filter: invert(0.25);
        }
        .img2{
           filter: grayscale(30%); /*decide blacknwhhite thing */ 
           filter: sepia(20%);
           
        }
        .img3{
            filter: brightness(150%) contrast(160%);
            filter: opacity(0.55);
            /* filter: drop-shadow(50%); */
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://media.gettyimages.com/id/1368265555/photo/vortex-split-view-of-blue-ocean-waters-surface.jpg?s=612x612&w=0&k=20&c=S7U0qen2-Jmm8hNqaKYXNSV5H-xDNNk9uYlSM6xLGfU=" alt="Ocean image">

        <img class="img2" src="https://i.pinimg.com/originals/57/4f/63/574f636b2887e2413e3f4125173075d8.jpg" alt="Boat image">

        <img class="img3" src="https://static.vecteezy.com/system/resources/thumbnails/022/335/482/small/lanscape-panoramic-view-of-the-mountains-aesthetic-background-generated-ai-photo.jpeg" alt="Mountain image ">

    </div>
</body>
</html>
