<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>
    <style>
          .container{
            border: 2px solid red;
            height: 80vh;
            display: flex;
            justify-content:center; /*there is no "justify-items" in flexbox*/
            align-items:center;
            /*when we only one line to centre then we will use "items" and if we have more than that we will use "content"*/
             /* align-content: flex-start; */

            /* flex-direction: column; */
            flex-direction: column-reverse;
            /* flex-direction: row-reverse; */
            flex-wrap: wrap;
             /*This used for when things overflow */
            /* flex-wrap: wrap-reverse; */
            flex-flow: row wrap;
            gap: 30px; /*this put gap between items*/
            /* gap: 20px 30px; (gap : row gap column gap;) */

            /* row-gap: 29px; */
            /* column-gap: 45px; */
          }
          .item{
            height: 32px;
            width: 32px;
            background-color: violet;
            border: 2px solid black;
            margin: 4px;

          }
          .order-1{
            order: 1;
          }
          .order-2{
            order: 2;
          }
          .order-3{
            order: 3;
          }
          .order-4{
            order: 4;
          }
          .item1{
            /* flex-grow: 2; */
            flex-shrink: 2;
          }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="item item1 ">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item order-1">4</div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
    </main>
</body>
</html>
