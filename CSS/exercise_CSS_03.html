<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Multicolor Website</title>
    <style>
        /* Pink theme */
        :root{
            --primary-color:rgb(230, 99, 120);  
            --text-color:rgb(237, 226, 226);
            --secondary-color:rgb(223, 170, 179);
        }
        /* Green theme */
        /* :root{  
            --primary-color:rgb(49, 153, 49);  
            --text-color:rgb(207, 226, 207);
            --secondary-color:rgb(101, 185, 105);
        } */
        body{
            background-color: var(--secondary-color);
        }
        *{
            margin: 0;
            padding: 0;
            font-family:'poppins', sans-serif  ;
        }
        nav{
            background-color: var(--primary-color);
            padding: 15px 0;
        }
        ul>li{
            list-style: none;
            display: inline;
            padding: 30px;
            font-weight: bold;
            
        }
        ul li a{
              color: var(--text-color);
              text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Services</a></li>
                <li><a href="/">contact Us</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
