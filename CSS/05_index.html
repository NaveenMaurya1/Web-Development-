<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Fonts</title>
    <style>
        p{
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            font-weight: 300;
            font-size: 20px;

            /* This puts space between lines */
            line-height: 1.3;  

        }
        h1{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        h2{
            text-align: center; /* this put it in centre */
           /* text-transform: capitalize;  */
           /* text-transform: uppercase;  */
           /* text-transform: lowercase;  */
           text-decoration: underline;
           text-decoration-color:aqua;
           text-decoration-style: dashed;
           text-indent: 13px;
        }
        .lorem{
            border:2px solid red;
            width: 145px;
            word-break: break-all;
            /* text-overflow: ellipsis; */
            /* overflow: hidden; */

        }
    </style>
</head>
<body>
    <div>
        <h1>Fonts</h1>
        <h2>About Fonts</h2>
        <P class="lorem">This is a video on fonts and abaurage</P>
        <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Asperiores consequuntur maxime nisi laborum pariatur nam laboriosam, magnam reprehenderit quaerat, voluptate delectus odio. Eaque!</p>

</html>
