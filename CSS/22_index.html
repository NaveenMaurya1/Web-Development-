<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transition</title>
    <style>
        .container {
            background-color: rgb(176, 112, 29);
            width: 50vw;
            height: 50vh;

        }

        .box {
            background-color: rgb(184, 195, 212);
            width: 10vw;
            height: 5vh;
            /* transition-property: transform; */
            /* transition-property: background-color , transform; */
            transition-property: all;
            transition-duration: 3s;
            transition-timing-function: ease-in-out; /* Here we can use cubic bezaare property */
            transition-delay: 0.25s;

            /* Shortcut for above properties */
            /* transition: all 3s ease-in-out 0.25s; */
        }

        .translate {
            transform: translateX(10vw) translateY(10vw);
            background-color: blue;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box translate"></div>
    </div>
</body>

</html>
