<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smooth Scroll Demo</title>
  <style>
    body {
      height: 2000px; /* makes page scrollable */
      font-family: Arial, sans-serif;
    }

    #scrollBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Scroll Down 👇</h1>
  <p>Keep scrolling to see the button...</p>

  <button id="scrollBtn">⬆ Back to Top</button>

  <script src="14_problem.js"> </script>

</body>
</html>
